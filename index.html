
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d14">
<title>OUTLAND</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #080d14;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

/* Hintergrund */

.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(135deg, rgba(4,10,18,.9), rgba(7,18,31,.65)),
        url("https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2200&q=90");
    background-position: center;
    background-size: cover;
    animation: backgroundMove 25s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

/* Dunkle Überlagerung */

.overlay {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at center, transparent 10%, rgba(0,0,0,.65) 100%);
}

/* Dezentes Raster */

.grid {
    position: fixed;
    inset: 0;
    opacity: .12;
    background-image:
        linear-gradient(rgba(130,180,220,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(130,180,220,.12) 1px, transparent 1px);
    background-size: 65px 65px;
    mask-image: linear-gradient(transparent, black, transparent);
}

/* Hauptbereich */

.container {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 90%;
}

/* Logo */

h1 {
    font-size: clamp(65px, 12vw, 125px);
    font-weight: 1000;
    letter-spacing: 14px;
    line-height: 1;
    color: #f5f8fc;
    text-shadow:
        0 0 20px rgba(80,160,230,.12),
        0 15px 50px rgba(0,0,0,.7);
    animation: logoIn 1s ease;
}

@keyframes logoIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
        letter-spacing: 25px;
    }
    to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 14px;
    }
}

/* Linie */

.line {
    width: 90px;
    height: 2px;
    background: #56baff;
    margin: 35px auto 42px;
    box-shadow: 0 0 15px rgba(86,186,255,.7);
}

/* Startknopf */

.start-button {
    position: relative;
    width: 280px;
    max-width: 100%;
    height: 65px;
    background: rgba(220,237,250,.96);
    border: 1px solid rgba(255,255,255,.7);
    color: #101c29;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 5px;
    cursor: pointer;
    overflow: hidden;
    transition: .25s ease;
    clip-path: polygon(
        8% 0,
        100% 0,
        100% 75%,
        92% 100%,
        0 100%,
        0 25%
    );
}

.start-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #55baff;
    transform: translateX(-105%);
    transition: transform .35s ease;
}

.start-button span {
    position: relative;
    z-index: 1;
}

.start-button:hover::before {
    transform: translateX(0);
}

.start-button:hover {
    box-shadow: 0 0 35px rgba(70,170,255,.35);
    transform: translateY(-3px);
}

.start-button:active {
    transform: scale(.97);
}

/* Eckmarkierungen */

.corner {
    position: fixed;
    width: 35px;
    height: 35px;
    border-color: rgba(100,180,240,.4);
    border-style: solid;
    z-index: 2;
}

.top-left {
    top: 25px;
    left: 25px;
    border-width: 1px 0 0 1px;
}

.top-right {
    top: 25px;
    right: 25px;
    border-width: 1px 1px 0 0;
}

.bottom-left {
    bottom: 25px;
    left: 25px;
    border-width: 0 0 1px 1px;
}

.bottom-right {
    bottom: 25px;
    right: 25px;
    border-width: 0 1px 1px 0;
}

@media(max-width:600px) {
    h1 {
        letter-spacing: 7px;
    }

    .line {
        margin: 28px auto 35px;
    }

    .start-button {
        width: 250px;
    }

    .corner {
        width: 23px;
        height: 23px;
    }
}

</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>
<div class="grid"></div>

<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<main class="container">

    <h1>OUTLAND</h1>

    <div class="line"></div>

    <button class="start-button"
        onclick="window.location.href='1.html'">
        <span>SPIEL STARTEN</span>
    </button>

</main>

</body>
</html>
